version: '3.8'

services:
  # Next.js 15 Frontend UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaintrace-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chaintrace-net

  # FastAPI Asynchronous Intelligence API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaintrace-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chaintrace_secure_postgres_pass_2026
      - POSTGRES_DB=chaintrace
      - USE_POSTGRES=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=chaintrace_secure_neo4j_pass_2026
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ETH_RPC_URL=https://cloudflare-eth.com
      - POLYGON_RPC_URL=https://polygon-rpc.com
      - COOKIE_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chaintrace-net

  # Celery Asynchronous Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaintrace-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chaintrace_secure_postgres_pass_2026
      - POSTGRES_DB=chaintrace
      - USE_POSTGRES=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=chaintrace_secure_neo4j_pass_2026
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chaintrace-net

  # PostgreSQL 16 Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: chaintrace-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chaintrace_secure_postgres_pass_2026
      - POSTGRES_DB=chaintrace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaintrace"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaintrace-net

  # Neo4j 5 Graph Database
  neo4j:
    image: neo4j:5.20-community
    container_name: chaintrace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/chaintrace_secure_neo4j_pass_2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1024M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p chaintrace_secure_neo4j_pass_2026 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chaintrace-net

  # Redis 7 In-Memory Cache & Broker
  redis:
    image: redis:7.0-alpine
    container_name: chaintrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chaintrace-net

networks:
  chaintrace-net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
