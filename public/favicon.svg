<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="favHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155EEF"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#087F8C"/>
    </linearGradient>
    <linearGradient id="favCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="favCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="favCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#050B14"/>

  <!-- Outer Hexagonal C-Chassis -->
  <path d="M 23 8 L 16 4 L 7 9 L 7 23 L 16 28 L 23 24" 
        stroke="url(#favHex)" 
        stroke-width="2.4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Intelligence Cube -->
  <polygon points="16,11 20.5,13.5 16,16 11.5,13.5" fill="url(#favCubeTop)" stroke="#BAE6FD" stroke-width="0.4"/>
  <polygon points="11.5,13.5 16,16 16,21 11.5,18.5" fill="url(#favCubeLeft)" stroke="#38BDF8" stroke-width="0.4"/>
  <polygon points="16,16 20.5,13.5 20.5,18.5 16,21" fill="url(#favCubeRight)" stroke="#38BDF8" stroke-width="0.4"/>

  <!-- Precision Center Point -->
